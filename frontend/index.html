<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B12" />
    <meta
      name="description"
      content="Imagen Perfecta · Medellín — Sistema académico de gestión de impresión fotográfica: pedidos, estructuras de datos, algoritmos y rutas."
    />
    <title>Imagen Perfecta · Medellín</title>
    <script>
      try {
        if (localStorage.getItem('ip-theme') !== 'light') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
